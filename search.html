<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVX Search - Results</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #161618;
      --text-main: #ededed;
      --text-sub: #a1a1aa;
      --accent: #3b82f6;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Top Navigation Bar */
    header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(13, 13, 13, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .logo {
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #fff;
      text-decoration: none;
    }

    .search-box {
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    /* Container for Results */
    .container {
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* OVERRIDING GOOGLE CSE DEFAULT STYLES */
    .gsc-control-cse {
      background-color: transparent !important;
      border: none !important;
      padding: 0 !important;
    }

    .gsc-webResult.gsc-result {
      background-color: var(--card-bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      padding: 16px !important;
      margin-bottom: 15px !important;
      box-shadow: none !important;
    }

    .gs-title, .gs-title * {
      color: #60a5fa !important;
      text-decoration: none !important;
      font-weight: 600 !important;
      font-size: 1.1rem !important;
      line-height: 1.4 !important;
    }

    .gs-title:hover {
      text-decoration: underline !important;
    }

    .gsc-url-top, .gs-bidi-start-align {
      color: var(--text-sub) !important;
      font-size: 0.8rem !important;
      margin-bottom: 6px !important;
    }

    .gs-snippet {
      color: var(--text-main) !important;
      font-size: 0.9rem !important;
      line-height: 1.5 !important;
      margin-top: 8px !important;
    }

    /* Hide Google Bloat */
    .gsc-thumbnail-inside, .gsc-url-bottom, .gs-watermark, .gsc-cursor-container {
      display: none !important;
    }

    .gsc-selected-option-container {
      background: var(--card-bg) !important;
      color: #fff !important;
      border-radius: 8px !important;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">RVX</a>
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="جستجو در RVX...">
    </div>
  </header>

  <div class="container">
    <!-- Google CSE Element -->
    <div class="gcse-searchresults-only"></div>
  </div>

  <script>
    // Get query parameter from URL
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');
    const input = document.getElementById('queryInput');

    if (query) {
      input.value = query;
    }

    // Handle new search on Enter
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && input.value.trim() !== '') {
        window.location.href = `search.html?q=${encodeURIComponent(input.value.trim())}`;
      }
    });

    // Load Google CSE Async
    window.__gcse = {
      parsetags: 'onload',
      initializationCallback: function() {
        if (query) {
          google.search.cse.element.getElement('default').execute(query);
        }
      }
    };

    (function() {
      var cx = 'a2b1f86d634be45a9'; // شناسه CSE شما
      var gcse = document.createElement('script');
      gcse.type = 'text/javascript';
      gcse.async = true;
      gcse.src = 'https://cse.google.com/cse.js?cx=' + cx;
      var s = document.getElementsByTagName('script')[0];
      s.parentNode.insertBefore(gcse, s);
    })();
  </script>
</body>
</html>

</style>
</head>
<body>

<main class="container">

    <a href="index.html" class="logo">RVX</a>

    <div class="search-wrapper">
        <div class="search-glow"></div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="جستجو..." autocomplete="off">
        </div>
    </div>

    <div class="categories">
        <span class="cat-item">همه</span>
        <span class="separator">|</span>
        <span class="cat-item">تصاویر</span>
        <span class="separator">|</span>
        <span class="cat-item">ویدیو</span>
        <span class="separator">|</span>
        <span class="cat-item">وب</span>
    </div>

    <div class="results-area">
        <div class="gcse-searchresults-only"></div>
    </div>

</main>

<script>
const searchInput = document.getElementById('search-input');

// خواندن متن سرچ‌شده از URL و اجرای اتوماتیک
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');
    
    if (query) {
        searchInput.value = query;
        
        // انتظار برای لود شدن کامل موتور گوگل
        const checkGoogle = setInterval(() => {
            if (window.google && google.search && google.search.cse && google.search.cse.element) {
                const element = google.search.cse.element.getElement('searchresults-only0');
                if (element) {
                    element.execute(query);
                    clearInterval(checkGoogle);
                }
            }
        }, 100);
    }
});

// قابلیت سرچ مجدد داخل همین صفحه نتایج
searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const query = this.value.trim();
        if (!query) return;
        
        const element = google.search.cse.element.getElement('searchresults-only0');
        if (element) {
            element.execute(query);
        }
    }
});
</script>

</body>
</html>
