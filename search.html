<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVX Search</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #f4f4f5;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-bottom: 1px solid #27272a;
      background: #0d0d0d;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #fff;
      text-decoration: none;
    }

    .search-box {
      flex: 1;
      max-width: 600px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    .container {
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">RVX</a>
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="جستجو در RVX...">
    </div>
  </header>

  <div class="container">
    <div class="gcse-searchresults-only"></div>
  </div>

  <script async src="https://cse.google.com/cse.js?cx=a2b1f86d634be45a9"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');
    const input = document.getElementById('queryInput');

    if (query) {
      input.value = query;
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && input.value.trim() !== '') {
        window.location.href = `search.html?q=${encodeURIComponent(input.value.trim())}`;
      }
    });
  </script>
</body>
</html>
