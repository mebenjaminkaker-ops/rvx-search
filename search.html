<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RVX Search</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100%;
        width: 100%;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
    }

    body {
        background-color: #000000;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100%;
        padding: 30px 16px 60px;
    }

    /* لوگوی RVX بالای صفحه */
    .logo {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 6px;
        color: #ffffff;
        margin-bottom: 26px;
        text-decoration: none;
    }

    /* کادر جستجوی نازک با نور سفید مخفی پشتش */
    .search-wrapper {
        position: relative;
        width: min(90vw, 480px);
        margin-bottom: 35px;
    }

    .search-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 130%;
        height: 220%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, transparent 70%);
        filter: blur(20px);
        pointer-events: none;
        z-index: 0;
    }

    .search-box {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 44px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: #000000;
        display: flex;
        align-items: center;
        padding: 0 20px;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.08);
    }

    .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 14px;
        font-weight: 300;
        color: #ffffff;
        text-align: right;
        direction: rtl;
        -webkit-user-select: text;
        user-select: text;
    }

    .search-box input::placeholder {
        color: rgba(255, 255, 255, 0.6);
        font-weight: 300;
    }

    /* کانتینر نتایج */
    .results-area {
        width: min(92vw, 650px);
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* کارت هر نتیجه */
    .result-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    /* هدر کارت: لوگو دایره‌ای سمت چپ و اسم سایت سمت راست */
    .site-header {
        display: flex;
        align-items: center;
        gap: 10px;
        direction: ltr; /* برای قرار گرفتن لوگو سمت چپ */
        justify-content: flex-end;
    }

    .site-favicon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background-color: #222;
        object-fit: cover;
    }

    .site-name {
        font-size: 13px;
        font-weight: 300;
        color: #ffffff;
        direction: ltr;
    }

    /* عنوان سایت */
    .site-title-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.4;
        transition: color 0.2s ease;
        direction: rtl;
        text-align: right;
    }

    /* تغییر رنگ عنوان به آبی وقتی دیده شد/کلیک شد */
    .site-title-link:visited {
        color: #3f6bff;
    }

    .site-title-link:hover {
        text-decoration: underline;
    }

    .status-msg {
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        text-align: center;
        font-weight: 300;
    }
</style>
</head>
<body>

    <a href="index.html" class="logo">RVX</a>

    <div class="search-wrapper">
        <div class="search-glow"></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجو..." autocomplete="off">
        </div>
    </div>

    <div class="results-area" id="resultsArea"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsArea = document.getElementById('resultsArea');

        // تابع دریافت نتایج از DuckDuckGo API
        async function runQuery(query) {
            if (!query) return;

            resultsArea.innerHTML = '<div class="status-msg">در حال جستجو...</div>';

            try {
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&origin=*`);
                const data = await response.json();

                resultsArea.innerHTML = '';
                let found = false;

                function createResultCard(url, fullText) {
                    try {
                        const parsedUrl = new URL(url);
                        const domain = parsedUrl.hostname.replace('www.', '');
                        const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                        const title = fullText.includes(' - ') ? fullText.split(' - ')[0] : fullText;

                        return `
                            <div class="result-item">
                                <div class="site-header">
                                    <img class="site-favicon" src="${favicon}" alt="" onerror="this.style.display='none'">
                                    <span class="site-name">${domain}</span>
                                </div>
                                <a class="site-title-link" href="${url}" target="_blank">${title}</a>
                            </div>
                        `;
                    } catch(e) {
                        return '';
                    }
                }

                if (data.AbstractText && data.AbstractURL) {
                    resultsArea.innerHTML += createResultCard(data.AbstractURL, data.Heading || query);
                    found = true;
                }

                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.forEach(item => {
                        if (item.FirstURL && item.Text) {
                            resultsArea.innerHTML += createResultCard(item.FirstURL, item.Text);
                            found = true;
                        }
                    });
                }

                if (!found) {
                    resultsArea.innerHTML = '<div class="status-msg">نتیجه‌ای پیدا نشد.</div>';
                }

            } catch (err) {
                resultsArea.innerHTML = '<div class="status-msg">خطا در دریافت نتایج.</div>';
                console.error(err);
            }
        }

        // اجرا موقع بارگذاری صفحه
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            if (query) {
                searchInput.value = query;
                runQuery(query);
            }
        });

        // سرچ مجدد با زدن دکمه Enter در صفحه نتایج
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                const query = searchInput.value.trim();
                history.replaceState(null, '', `search.html?q=${encodeURIComponent(query)}`);
                runQuery(query);
            }
        });
    </script>
</body>
</html>
