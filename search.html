<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RVX Search</title>
<style>
    :root {
        --link-color: #3f6bff;
    }

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
    }

    body {
        background-color: #030303;
        color: #f5f7ff;
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100%;
        padding: 30px 16px 60px;
    }

    .logo {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 6px;
        color: #ffffff;
        margin-bottom: 26px;
        text-decoration: none;
        -webkit-user-select: none;
        user-select: none;
    }

    /* کادر جستجوی نازک با نور سفید مخفی پشتش */
    .search-wrapper {
        position: relative;
        width: min(90vw, 480px);
        margin-bottom: 30px;
    }

    .search-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 140%;
        height: 260%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, transparent 70%);
        filter: blur(20px);
        pointer-events: none;
        z-index: 0;
    }

    .search-box {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 44px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: #000000;
        display: flex;
        align-items: center;
        padding: 0 20px;
    }

    .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 14px;
        font-weight: 300;
        color: #ffffff;
        text-align: right;
        -webkit-user-select: text;
        user-select: text;
    }

    .search-box input::placeholder {
        color: rgba(255, 255, 255, 0.7);
        font-weight: 300;
    }

    /* کانتینر نتایج */
    .results-area {
        width: min(92vw, 700px);
    }

    /* ---- استایل‌دهی نتایج گوگل به شکل کارت شیشه‌ای ---- */
    .gsc-control-cse {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif !important;
    }

    .gsc-search-box, .gsc-input-box, .gsc-search-button {
        display: none !important;
    }

    .gsc-webResult.gsc-result {
        background: rgba(255, 255, 255, 0.06) !important;
        backdrop-filter: blur(14px) !important;
        -webkit-backdrop-filter: blur(14px) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-radius: 16px !important;
        padding: 18px 20px !important;
        margin-bottom: 16px !important;
        transition: border-color 0.2s ease, background 0.2s ease;
    }

    .gsc-webResult.gsc-result:hover {
        border-color: rgba(255, 255, 255, 0.3) !important;
        background: rgba(255, 255, 255, 0.09) !important;
    }

    .gs-title, .gs-title a, .gs-title a:visited, .gs-title a b {
        color: var(--link-color) !important;
        text-decoration: none !important;
        font-size: 18px !important;
        font-weight: 700 !important;
    }

    .gs-title a:hover {
        text-decoration: underline !important;
    }

    .gs-visibleUrl, .gs-visibleUrl-long, .gs-visibleUrl-short {
        color: rgba(245, 247, 255, 0.5) !important;
        font-size: 12px !important;
        margin-bottom: 6px !important;
        direction: ltr;
        text-align: right;
        display: block;
    }

    .gs-snippet, .gs-snippet b {
        color: rgba(245, 247, 255, 0.75) !important;
        font-size: 14px !important;
        line-height: 1.7 !important;
        margin-top: 4px !important;
    }

    .gsc-cursor-box {
        text-align: center !important;
        margin-top: 10px;
    }

    .gsc-cursor-page {
        color: rgba(245, 247, 255, 0.7) !important;
        background: rgba(255, 255, 255, 0.06) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-radius: 8px !important;
        padding: 6px 12px !important;
        margin: 0 4px !important;
    }

    .gsc-cursor-current-page {
        color: #000 !important;
        background: #ffffff !important;
    }

    .gs-no-results-result .gs-snippet {
        color: rgba(245, 247, 255, 0.6) !important;
        text-align: center;
    }
</style>
</head>
<body>

    <a href="index.html" class="logo">RVX</a>

    <div class="search-wrapper">
        <div class="search-glow"></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجو..." autocomplete="off">
        </div>
    </div>

    <div class="results-area">
        <div class="gcse-searchresults-only" data-gname="searchresults-only0"></div>
    </div>

    <script async src="https://cse.google.com/cse.js?cx=25febd6e7adb042c6"></script>

    <script>
        const searchInput = document.getElementById('searchInput');

        function runQuery(query) {
            const el = google?.search?.cse?.element?.getElement('searchresults-only0');
            if (el) {
                el.execute(query);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            if (!query) return;

            searchInput.value = query;

            const waitForGoogle = setInterval(() => {
                if (window.google && google.search && google.search.cse && google.search.cse.element) {
                    runQuery(query);
                    clearInterval(waitForGoogle);
                }
            }, 100);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                const query = searchInput.value.trim();
                history.replaceState(null, '', `search.html?q=${encodeURIComponent(query)}`);
                runQuery(query);
            }
        });
    </script>
</body>
</html>
