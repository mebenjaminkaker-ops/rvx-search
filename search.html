<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RVX Search</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #000000;
        color: #ffffff;
        font-family: Tahoma, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 16px;
        min-height: 100vh;
    }
    .logo {
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 6px;
        color: #ffffff;
        margin-bottom: 25px;
        text-decoration: none;
    }
    .search-wrapper {
        position: relative;
        width: min(90vw, 500px);
        margin-bottom: 30px;
    }
    .search-glow {
        position: absolute;
        top: 50%; left: 50%;
        width: 120%; height: 200%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
        filter: blur(15px);
        pointer-events: none;
    }
    .search-box {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 42px;
        border-radius: 21px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: #000000;
        display: flex;
        align-items: center;
        padding: 0 18px;
    }
    .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 14px;
        color: #ffffff;
        text-align: right;
        direction: rtl;
    }
    .results-area {
        width: min(92vw, 650px);
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .result-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: right;
        direction: rtl;
    }
    .site-header {
        display: flex;
        align-items: center;
        gap: 8px;
        direction: ltr;
        justify-content: flex-end;
    }
    .site-favicon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
    }
    .site-name {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
    }
    .site-title-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 17px;
        font-weight: bold;
    }
    .site-title-link:visited { color: #3b82f6; }
    .status-msg { color: #666; font-size: 14px; text-align: center; }
</style>
</head>
<body>

    <a href="index.html" class="logo">RVX</a>

    <div class="search-wrapper">
        <div class="search-glow"></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجو..." autocomplete="off">
        </div>
    </div>

    <div class="results-area" id="resultsArea"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsArea = document.getElementById('resultsArea');

        async function runQuery(query) {
            if (!query) return;
            resultsArea.innerHTML = '<div class="status-msg">در حال دریافت نتایج...</div>';

            try {
                // دریافت سرچ واقعی به زبان فارسی از دیتابیس آزاد
                const url = `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();

                resultsArea.innerHTML = '';
                if (data.query && data.query.search.length > 0) {
                    data.query.search.forEach(item => {
                        const pageUrl = `https://fa.wikipedia.org/wiki/${encodeURIComponent(item.title)}`;
                        resultsArea.innerHTML += `
                            <div class="result-item">
                                <div class="site-header">
                                    <span class="site-name">fa.wikipedia.org</span>
                                    <img class="site-favicon" src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=64">
                                </div>
                                <a class="site-title-link" href="${pageUrl}" target="_blank">${item.title}</a>
                            </div>
                        `;
                    });
                } else {
                    resultsArea.innerHTML = '<div class="status-msg">نتیجه‌ای پیدا نشد.</div>';
                }
            } catch (err) {
                resultsArea.innerHTML = '<div class="status-msg">خطا در متصل شدن به شبکه.</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            if (query) {
                searchInput.value = query;
                runQuery(query);
            }
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                const q = searchInput.value.trim();
                history.replaceState(null, '', `search.html?q=${encodeURIComponent(q)}`);
                runQuery(q);
            }
        });
    </script>
</body>
</html>
