<!DOCTYPE html>
<html lang="fa" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RVX Search</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #000000;
        color: #ffffff;
        font-family: Tahoma, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 16px;
        min-height: 100vh;
    }
    .logo {
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 6px;
        color: #ffffff;
        margin-bottom: 25px;
        text-decoration: none;
    }
    .search-wrapper {
        position: relative;
        width: min(90vw, 500px);
        margin-bottom: 30px;
    }
    .search-glow {
        position: absolute;
        top: 50%; left: 50%;
        width: 120%; height: 200%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
        filter: blur(15px);
        pointer-events: none;
    }
    .search-box {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 42px;
        border-radius: 21px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: #000000;
        display: flex;
        align-items: center;
        padding: 0 18px;
    }
    .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 14px;
        color: #ffffff;
    }

    html[dir="rtl"] .search-box input {
        text-align: right;
        direction: rtl;
    }
    html[dir="ltr"] .search-box input {
        text-align: left;
        direction: ltr;
    }
</style>
</head>
<body>

    <a href="index.html" class="logo">RVX</a>

    <form id="searchForm" class="search-wrapper" action="https://www.google.com/search" method="GET" target="_blank">
        <div class="search-glow"></div>
        <div class="search-box">
            <input type="text" id="userInput" placeholder="جستجو در لیست سایت‌ها..." autocomplete="off" required>
        </div>
        <!-- ورودی مخفی برای اعمال فیلتر ۱۳ سایت -->
        <input type="hidden" name="q" id="finalQuery">
    </form>

    <script>
        const htmlRoot = document.getElementById('htmlRoot');
        const searchForm = document.getElementById('searchForm');
        const userInput = document.getElementById('userInput');
        const finalQuery = document.getElementById('finalQuery');

        // تشخیص زبان مرورگر
        const userLang = navigator.language || navigator.userLanguage;
        const isPersian = userLang.startsWith('fa');

        if (isPersian) {
            htmlRoot.setAttribute('dir', 'rtl');
            htmlRoot.setAttribute('lang', 'fa');
            userInput.placeholder = "جستجو در لیست سایت‌ها...";
        } else {
            htmlRoot.setAttribute('dir', 'ltr');
            htmlRoot.setAttribute('lang', 'en');
            userInput.placeholder = "Search selected sites...";
        }

        // لیست دامنه‌های مجاز
        const allowedDomains = [
            'play.google.com',
            'farsroid.com',
            'soft98.ir',
            'google.com',
            'minecraft.net',
            'myket.ir',
            'cafebazaar.ir',
            'youtube.com',
            'instagram.com',
            'tiktok.com',
            'wikipedia.org',
            'telegram.org',
            'x.com'
        ];

        searchForm.addEventListener('submit', (e) => {
            const query = userInput.value.trim();
            if (!query) {
                e.preventDefault();
                return;
            }

            // چسباندن فیلتر سایت‌ها به انتهای عبارت سرچ
            const siteFilter = allowedDomains.map(d => `site:${d}`).join(' OR ');
            finalQuery.value = `${query} (${siteFilter})`;
        });
    </script>
</body>
</html>
