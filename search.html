<!DOCTYPE html>
<html lang="fa" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RVX Search</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #000000;
        color: #ffffff;
        font-family: Tahoma, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 16px;
        min-height: 100vh;
    }
    .logo {
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 6px;
        color: #ffffff;
        margin-bottom: 25px;
        text-decoration: none;
    }
    .search-wrapper {
        position: relative;
        width: min(90vw, 500px);
        margin-bottom: 30px;
    }
    .search-glow {
        position: absolute;
        top: 50%; left: 50%;
        width: 120%; height: 200%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
        filter: blur(15px);
        pointer-events: none;
    }
    .search-box {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 42px;
        border-radius: 21px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: #000000;
        display: flex;
        align-items: center;
        padding: 0 18px;
    }
    .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 14px;
        color: #ffffff;
    }
    .results-area {
        width: min(92vw, 650px);
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .result-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .site-header {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .site-favicon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
    }
    .site-name {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
    }
    .site-title-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        line-height: 1.4;
    }
    .site-title-link:visited { color: #3b82f6; }
    .status-msg { color: #666; font-size: 14px; text-align: center; }

    html[dir="rtl"] .search-box input,
    html[dir="rtl"] .result-item {
        text-align: right;
        direction: rtl;
    }
    html[dir="rtl"] .site-header {
        direction: ltr;
        justify-content: flex-end;
    }

    html[dir="ltr"] .search-box input,
    html[dir="ltr"] .result-item {
        text-align: left;
        direction: ltr;
    }
    html[dir="ltr"] .site-header {
        direction: ltr;
        justify-content: flex-start;
    }
</style>
</head>
<body>

    <a href="index.html" class="logo">RVX</a>

    <div class="search-wrapper">
        <div class="search-glow"></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجو..." autocomplete="off">
        </div>
    </div>

    <div class="results-area" id="resultsArea"></div>

    <script>
        const htmlRoot = document.getElementById('htmlRoot');
        const searchInput = document.getElementById('searchInput');
        const resultsArea = document.getElementById('resultsArea');

        const userLang = navigator.language || navigator.userLanguage;
        const isPersian = userLang.startsWith('fa');

        if (isPersian) {
            htmlRoot.setAttribute('dir', 'rtl');
            htmlRoot.setAttribute('lang', 'fa');
        } else {
            htmlRoot.setAttribute('dir', 'ltr');
            htmlRoot.setAttribute('lang', 'en');
        }

        const allowedDomains = [
            'play.google.com',
            'farsroid.com',
            'soft98.ir',
            'google.com',
            'minecraft.net',
            'myket.ir',
            'cafebazaar.ir',
            'youtube.com',
            'instagram.com',
            'tiktok.com',
            'wikipedia.org',
            'telegram.org',
            'x.com'
        ];

        async function runQuery(query) {
            if (!query) return;
            resultsArea.innerHTML = '<div class="status-msg">در حال جستجو در سایت‌های منتخب...</div>';

            try {
                // ارسال درخواست مستقیم برای استخراج نتایج واقعی از پروکسی دیتابیس آزاد
                const siteQuery = allowedDomains.map(d => `site:${d}`).join(' OR ');
                const fullQuery = `${query} (${siteQuery})`;
                
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(fullQuery))}`;
                
                const res = await fetch(proxyUrl);
                const data = await res.json();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                const links = doc.querySelectorAll('.result__a');

                resultsArea.innerHTML = '';

                if (links.length > 0) {
                    links.forEach((link, index) => {
                        if (index < 10) { // نمایش ۱۰ نتیجه اول
                            let href = link.getAttribute('href');
                            
                            // پاکسازی لینک‌های DuckDuckGo
                            if (href.includes('uddg=')) {
                                href = decodeURIComponent(href.split('uddg=')[1].split('&')[0]);
                            }

                            let domain = 'web';
                            try {
                                domain = new URL(href).hostname.replace('www.', '');
                            } catch(e) {}

                            const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                            resultsArea.innerHTML += `
                                <div class="result-item">
                                    <div class="site-header">
                                        <img class="site-favicon" src="${favicon}" onerror="this.style.display='none'">
                                        <span class="site-name">${domain}</span>
                                    </div>
                                    <a class="site-title-link" href="${href}" target="_blank">${link.innerText}</a>
                                </div>
                            `;
                        }
                    });
                } else {
                    resultsArea.innerHTML = '<div class="status-msg">نتیجه‌ای یافت نشد.</div>';
                }

            } catch (err) {
                resultsArea.innerHTML = '<div class="status-msg">خطا در دریافت نتایج. دوباره تلاش کن.</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            if (query) {
                searchInput.value = query;
                runQuery(query);
            }
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                const q = searchInput.value.trim();
                history.replaceState(null, '', `search.html?q=${encodeURIComponent(q)}`);
                runQuery(q);
            }
        });
    </script>
</body>
</html>
