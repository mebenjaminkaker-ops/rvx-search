<!DOCTYPE html>
<html lang="fa" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RVX Search</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #000000;
        color: #ffffff;
        font-family: Tahoma, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 10px;
        min-height: 100vh;
    }
    .logo {
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 6px;
        color: #ffffff;
        margin-bottom: 20px;
        text-decoration: none;
    }
    .search-wrapper {
        position: relative;
        width: min(92vw, 550px);
        margin-bottom: 20px;
    }
    .search-glow {
        position: absolute;
        top: 50%; left: 50%;
        width: 120%; height: 200%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
        filter: blur(15px);
        pointer-events: none;
    }
    .search-box {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 42px;
        border-radius: 21px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: #000000;
        display: flex;
        align-items: center;
        padding: 0 18px;
    }
    .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-size: 14px;
        color: #ffffff;
    }
    .iframe-container {
        width: min(95vw, 700px);
        flex-grow: 1;
        height: 75vh;
        border: none;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        color-scheme: dark;
    }

    html[dir="rtl"] .search-box input { text-align: right; direction: rtl; }
    html[dir="ltr"] .search-box input { text-align: left; direction: ltr; }
</style>
</head>
<body>

    <a href="index.html" class="logo">RVX</a>

    <div class="search-wrapper">
        <div class="search-glow"></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجو..." autocomplete="off">
        </div>
    </div>

    <!-- نتایج دقیقاً در این کادر و داخل خود صفحه نمایش داده می‌شوند -->
    <div class="iframe-container" id="resultsContainer">
        <iframe id="resultsFrame" name="resultsFrame" src="about:blank"></iframe>
    </div>

    <script>
        const htmlRoot = document.getElementById('htmlRoot');
        const searchInput = document.getElementById('searchInput');
        const resultsFrame = document.getElementById('resultsFrame');

        const userLang = navigator.language || navigator.userLanguage;
        if (userLang.startsWith('fa')) {
            htmlRoot.setAttribute('dir', 'rtl');
            htmlRoot.setAttribute('lang', 'fa');
            searchInput.placeholder = "جستجو در سایت‌های منتخب...";
        } else {
            htmlRoot.setAttribute('dir', 'ltr');
            htmlRoot.setAttribute('lang', 'en');
            searchInput.placeholder = "Search selected sites...";
        }

        const allowedDomains = [
            'play.google.com',
            'farsroid.com',
            'soft98.ir',
            'google.com',
            'minecraft.net',
            'myket.ir',
            'cafebazaar.ir',
            'youtube.com',
            'instagram.com',
            'tiktok.com',
            'wikipedia.org',
            'telegram.org',
            'x.com'
        ];

        function executeSearch(query) {
            if (!query) return;
            const siteFilter = allowedDomains.map(d => `site:${d}`).join(' OR ');
            const fullQuery = `${query} (${siteFilter})`;
            
            // بارگذاری نتایج در فریم داخل خود صفحه
            const targetUrl = `https://www.google.com/search?q=${encodeURIComponent(fullQuery)}&igu=1`;
            resultsFrame.src = targetUrl;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) {
                searchInput.value = q;
                executeSearch(q);
            }
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                const q = searchInput.value.trim();
                history.replaceState(null, '', `search.html?q=${encodeURIComponent(q)}`);
                executeSearch(q);
            }
        });
    </script>
</body>
</html>
